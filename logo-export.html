<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #111; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card {
    background: #0c0a08;
    border-radius: 32px;
    width: 512px;
    height: 512px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  .brand { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .name {
    font-family: Georgia, serif;
    font-size: 56px;
    font-weight: 900;
    color: #f0e6d0;
    letter-spacing: -1px;
  }
  .sub {
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 7px;
    text-transform: uppercase;
    color: #d98f0e;
    font-weight: 700;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="card">
    <!-- Vinyl record SVG (from Navbar.tsx) -->
    <svg viewBox="0 0 40 40" fill="none" width="180" height="180">
      <circle cx="20" cy="20" r="19" fill="#d98f0e"/>
      <circle cx="20" cy="20" r="16.5" fill="none" stroke="#0c0a08" stroke-width="1"   opacity="0.35"/>
      <circle cx="20" cy="20" r="14"   fill="none" stroke="#0c0a08" stroke-width="0.7" opacity="0.30"/>
      <circle cx="20" cy="20" r="11.5" fill="none" stroke="#0c0a08" stroke-width="0.6" opacity="0.25"/>
      <circle cx="20" cy="20" r="9"  fill="#0c0a08"/>
      <circle cx="20" cy="20" r="8"  fill="none" stroke="#d98f0e" stroke-width="0.5" opacity="0.4"/>
      <circle cx="20" cy="20" r="5.5" fill="none" stroke="#d98f0e" stroke-width="0.4" opacity="0.25"/>
      <circle cx="20" cy="20" r="2.2" fill="#d98f0e" opacity="0.85"/>
      <circle cx="20" cy="20" r="0.9" fill="#0c0a08"/>
    </svg>
    <div class="brand">
      <span class="name">Garimpa</span>
      <span class="sub">vinil</span>
    </div>
  </div>
</body>
</html>
