name: Vinyl Crawler

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours — steady cadence; refresh is on the Creators API now,
                            # so the old 24/7 self-trigger loop is gone (it burned the daily TPD budget)
  workflow_dispatch:         # manual trigger from the GitHub Actions UI

# Prevent concurrent runs: if a previous crawl is still going when the next
# one is scheduled, let the in-progress run finish rather than cancelling it.
concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # hard ceiling (3h); crawler --time-limit 160 stops 20 min before
    permissions:
      issues: write        # needed for the "open issue on failure" step
    env:
      # Opt into Node.js 24 now before it becomes mandatory on 2026-06-02.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Restore crawl state
        uses: actions/cache@v4
        with:
          path: crawler/.crawl_state.json
          key: crawl-state-${{ github.run_id }}
          restore-keys: crawl-state-

      - name: Run crawler
        # --stale-workers 4 runs Phase 0 (deal re-validation) and Phase 3 in parallel;
        #                   cuts Phase 0 time from ~27 min to ~14 min, freeing budget for Phase 3.
        # --time-limit 160  leaves a 20-min buffer before the GHA 180-min ceiling.
        # --max-pages omitted → uses MAX_PAGES_DEFAULT (400 × CATEGORY_SLICE_FRACTION = 80 pages = 20%).
        run: python crawler/main.py --stale-workers 4 --time-limit 160
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ASSOCIATE_TAG: ${{ secrets.ASSOCIATE_TAG }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ── Creators API refresh (Phase 0 + Phase 3) ──
          CREATORS_REFRESH_ENABLED: "1"
          CREATORS_CLIENT_ID: ${{ secrets.CREATORS_CLIENT_ID }}
          CREATORS_CLIENT_SECRET: ${{ secrets.CREATORS_CLIENT_SECRET }}
          CREATORS_PARTNER_TAG: ${{ secrets.CREATORS_PARTNER_TAG }}
          CREATORS_CREDENTIAL_VERSION: v3.1
          CREATORS_TPS: "1"
          CREATORS_TPD: "8640"          # UTC-day cap, now enforced across runs via api_budget_ledger
          CREATORS_TPD_PER_RUN: "1000"  # per-run cap; 8 runs * 1000 < day cap, so Phase-0 deals never starve
          CREATORS_API_WORKERS: "8"     # parallel getItems; shared TPS bucket still caps real rate at <= TPS
          FRESHNESS_FLOOR_MINUTES: "180"
          HOTSET_FLOOR_MINUTES: "720"   # re-price flagged hot-set ~2x/day (not every run) so the cold tail gets budget
          # ── Popularity-weighted Phase-3 scheduling ──
          # Tier freshness by Last.fm reach: S=8h A=24h B=36h C=48h F=72h. Projected
          # backlog ~1.5k API/day vs 8640 cap. Rollback = set "0" (instant, clean, → FIFO).
          TIER_SCHEDULE_ENABLED: "1"
          AMAZON_MAX_CONCURRENCY: "4"
          # ── Alert emails ──
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Post-crawl data-quality check (CD incident)
        if: always()
        run: python crawler/post_crawl_check.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Crawler failed — ${new Date().toISOString().slice(0, 16)} UTC`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The crawler workflow failed.\n\n[View run](${runUrl})`,
              labels: ['crawler-failure'],
            });

      - name: Upload crawler log
        # Durable copy of the run log (the Postgres crawl_run_metrics table holds
        # the structured metrics; this artifact is the full narrative log).
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vinyl-crawler-log-${{ github.run_id }}
          path: crawler/vinyl_crawler.log
          if-no-files-found: ignore
