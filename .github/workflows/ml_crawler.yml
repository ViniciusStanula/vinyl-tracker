name: Mercado Livre Crawler

on:
  schedule:
    - cron: '0 6,18 * * *'   # twice daily (03h/15h BRT) — API-priced, low churn;
                             # ~5 runs (≈2.5 days) to cross price_count>=5 for list pages
  workflow_dispatch:          # manual trigger from the GitHub Actions UI

# Don't run two ML syncs at once (the CSV upsert + sync-unavailable step
# should never overlap). Let an in-progress run finish.
concurrency:
  group: ml-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write        # needed for the "open issue on failure" step

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run Mercado Livre crawler
        run: python crawler/ml_crawler.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          # Cache purge so new ML prices show immediately (same webhook as Amazon crawler)
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Mercado Livre crawler failed — ${new Date().toISOString().slice(0, 16)} UTC`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The Mercado Livre crawler workflow failed.\n\n[View run](${runUrl})`,
              labels: ['crawler-failure'],
            });

      - name: Upload crawler log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ml-crawler-log-${{ github.run_id }}
          path: crawler/ml_crawler.log
          if-no-files-found: ignore
