name: MusicBrainz Enrichment

# Enriches matched discos with MusicBrainz release-group data in three
# sequential passes (MusicBrainz allows ~1 request/sec per IP, so they must
# not overlap):
#   1. mb_enrich    — match release-group: mbid, year, type, genres
#   2. mb_rating    — community rating (>=10 votes surfaced on the page)
#   3. mb_tracklist — tracklist + per-track durations
# Runs on a fixed schedule (NOT self-triggering): each run drains up to
# MAX_CHUNKS per pass, then stops. The backlog is worked down across scheduled
# runs and the job becomes a cheap no-op once caught up. A previous self-trigger
# loop was removed — a filter mismatch made it re-fire every ~25s indefinitely.

on:
  workflow_dispatch:
    inputs:
      max_chunks:
        description: "Chunks (200 rows each) per pass this run"
        default: "10"
  schedule:
    - cron: "40 */6 * * *"   # every 6h at :40 UTC (4 runs/day)

concurrency:
  group: mb-enrichment    # one MB job at a time (rate limit)
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MAX_CHUNKS: ${{ github.event.inputs.max_chunks || '10' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Pass 1 — match release-groups
        working-directory: crawler
        run: python mb_enrich.py --max-chunks "$MAX_CHUNKS"

      - name: Pass 2 — community ratings
        working-directory: crawler
        run: python mb_rating.py --max-chunks "$MAX_CHUNKS"

      - name: Pass 3 — tracklists + durations
        working-directory: crawler
        run: python mb_tracklist.py --max-chunks "$MAX_CHUNKS"

      - name: Report remaining enrichment backlog
        if: success()
        run: |
          # Visibility only — logs how much work is left after this run. The
          # format guard mirrors the fetch_albums_needing_* selectors in
          # database.py so the count reflects rows the passes will actually
          # process (non-vinyl rows are excluded by those selectors).
          REMAINING=$(psql "$DATABASE_URL" -t -c "
            SELECT
              (SELECT COUNT(*) FROM \"Disco\"
                 WHERE mb_mbid IS NULL AND disponivel = TRUE
                   AND (format IS NULL OR format = 'vinyl')
                   AND artista !~* 'artista n[ãa]o identificad')
            + (SELECT COUNT(*) FROM \"Disco\"
                 WHERE mb_mbid <> '' AND mb_rating IS NULL AND disponivel = TRUE
                   AND (format IS NULL OR format = 'vinyl'))
            + (SELECT COUNT(*) FROM \"Disco\"
                 WHERE mb_mbid <> '' AND mb_tracklist IS NULL AND disponivel = TRUE
                   AND (format IS NULL OR format = 'vinyl'))
          " | tr -d ' ')
          echo "Remaining MB enrichment rows after this run: $REMAINING"
          echo "(worked down over the 6-hourly schedule; no self-trigger.)"
