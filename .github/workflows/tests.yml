name: Crawler Tests

# The crawler test suite has existed for a while but nothing ever ran it, so it
# only caught a bug on the days someone remembered to type pytest.
#
# The comma-rotation bug is the case for this job: normalize_artist() inverted
# every name containing a comma, "Tyler, The Creator" included. It reached
# production, scrambled 21 artist names along with their slugs, and made them
# unmatchable against MusicBrainz — which is why they had no country. Repairing
# it afterwards cost a verification script, a dry run and 10 redirects.
# tests/test_domain.py now asserts that name survives intact.
#
# No database, no network, no secrets: the one test that imports database hands
# it a fake connection that records the SQL. 170 tests in under a second.

on:
  pull_request:
    paths:
      - 'crawler/**'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - 'crawler/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: crawler-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        # pytest is not in requirements.txt because the scheduled crawler jobs
        # have no use for it.
        run: |
          pip install -r crawler/requirements.txt
          pip install pytest==8.3.4

      - name: Run tests
        # From crawler/, because the modules import each other flat
        # (`from domain import ...`) rather than as a package.
        working-directory: crawler
        run: python -m pytest tests -q
