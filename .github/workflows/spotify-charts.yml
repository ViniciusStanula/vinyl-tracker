name: Spotify Charts Update

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily — kworb updates ~06:00 UTC
  workflow_dispatch:        # manual trigger

concurrency:
  group: spotify-charts
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-charts.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-charts.txt

      - name: Run fetch_artists
        run: python scripts/fetch_artists.py

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/top_artists.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update Spotify charts [$(date -u +%Y-%m-%d)]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel redeploy
        # Only redeploy when data actually changed.
        # Set VERCEL_DEPLOY_HOOK in repo Settings → Secrets → Actions.
        # Create the hook at: vercel.com → project → Settings → Git → Deploy Hooks
        if: steps.commit.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -s -X POST "$HOOK"
          fi
