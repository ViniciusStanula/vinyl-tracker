name: Spotify Charts Update

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily — kworb updates ~06:00 UTC
  workflow_dispatch:        # manual trigger

concurrency:
  group: spotify-charts
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-charts.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-charts.txt

      - name: Run fetch_artists
        run: python scripts/fetch_artists.py

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/top_artists.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update Spotify charts [$(date -u +%Y-%m-%d)]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # No deploy hook here on purpose. The push above already triggers a
      # production deploy through Vercel's git integration, so firing a hook as
      # well started TWO production builds seconds apart:
      #
      #   10:01:34  push  chore: update Spotify charts [2026-08-02]
      #   10:01:37  deploy ih4kisxnv  -> Ready
      #   10:01:39  deploy 7tdcl3skj  -> Error
      #
      # Each build prerenders ~600 pages with 3 workers holding their own
      # Prisma pools. Two at once exceeded the Supabase pooler's 400-client
      # limit and the second died mid-prerender:
      #
      #   Error [DriverAdapterError]: (EMAXCONN) max client connections
      #   reached, limit: 400
      #
      # The failure is a race, so it shows up as an intermittent red build on a
      # commit that is perfectly fine.
