name: Alerts Cleanup

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily — delete unconfirmed subscriptions older than 7 days
  workflow_dispatch:

concurrency:
  group: alerts-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Delete unconfirmed subscriptions older than 7 days
        run: python crawler/alerts_cleanup.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Alerts cleanup failed — ${new Date().toISOString().slice(0, 16)} UTC`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The alerts cleanup workflow failed.\n\n[View run](${runUrl})`,
              labels: ['crawler-failure'],
            });
