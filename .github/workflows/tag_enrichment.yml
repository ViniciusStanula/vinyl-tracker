name: Last.fm Tag Enrichment

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:          # manual trigger from the GitHub Actions UI

concurrency:
  group: tag-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run tag enrichment
        # Fetches Last.fm genre tags per RECORD (album.getTopTags) for every
        # Disco row where lastfm_tags IS NULL -- i.e. brand-new listings
        # since the last run, not a one-time backfill despite the filename.
        # Per-artist tagging (pre-2026-07-29) stamped the same 3 tags onto
        # every album by an artist; see crawler/rematch_album_tags.py for the
        # backfill that corrected the already-clobbered rows.
        run: python crawler/backfill_tags.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

      - name: Reset failed Last.fm enrichments
        # Resets lastfm_listeners=0 → NULL so the enrichment step retries them
        # with the album.search fallback. Safe to run every time: only touches
        # records that previously got no result from Last.fm.
        run: python crawler/lastfm_album_enricher.py --reset-failed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Enrich albums missing Last.fm data
        # Retries records reset above + picks up any new albums.
        # Falls back to album.search when album.getInfo finds nothing.
        # 500 albums × 0.5s ≈ 4 min per run.
        run: python crawler/lastfm_album_enricher.py --limit 500
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

