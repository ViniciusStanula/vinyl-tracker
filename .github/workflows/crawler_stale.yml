name: Vinyl Crawler — Stale-Only

on:
  schedule:
    - cron: '30 */2 * * *'  # every 2 hours at :30 — offset from main crawler safety-net cron
  workflow_dispatch:

# Separate concurrency group so this never blocks or is blocked by the main crawler.
concurrency:
  group: crawler-stale
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # hard ceiling; --time-limit 100 stops 20 min before
    permissions:
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run stale-only crawler
        # --stale-only      skips category discovery (phases 0/1/2); dedicates full budget to
        #                   re-checking prices on existing records (Phase 3).
        # --stale-workers 4 parallel Amazon fetches.
        # --time-limit 100  fits within the 2-hour schedule window with 20 min to spare.
        # claim locking in fetch_stale_records ensures no duplicate work if this run
        # overlaps with the main crawler.
        run: python crawler/main.py --stale-only --stale-workers 4 --stale-max 0 --time-limit 100
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ASSOCIATE_TAG: ${{ secrets.ASSOCIATE_TAG }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Stale crawler failed — ${new Date().toISOString().slice(0, 16)} UTC`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The stale-only crawler workflow failed.\n\n[View run](${runUrl})`,
              labels: ['crawler-failure'],
            });
