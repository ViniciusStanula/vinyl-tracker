name: Format Sweep (CD incident)

# Classifies the physical format of catalog rows that predate the vinyl
# allowlist gate (format IS NULL). Self-triggers after each run until no
# NULL rows remain, then becomes a cheap no-op.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max product pages to verify this run"
        default: "1000"
  schedule:
    # Backup trigger every 3 hours — restarts the self-trigger chain if it
    # breaks (failed run, bot abort, etc.). Concurrency group prevents overlap.
    - cron: "20 */3 * * *"

permissions:
  actions: write  # required for gh workflow run self-trigger

concurrency:
  group: format-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run format sweep
        working-directory: crawler
        run: python format_sweep.py --limit "${{ github.event.inputs.limit || '1000' }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Post-crawl data-quality check (CD incident)
        if: always()
        run: python crawler/post_crawl_check.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Re-trigger if NULL rows remain
        if: success()
        run: |
          REMAINING=$(psql "$DATABASE_URL" -t -c 'SELECT COUNT(*) FROM "Disco" WHERE format IS NULL' | tr -d ' ')
          echo "Remaining NULL format rows: $REMAINING"
          if [ "$REMAINING" -gt 0 ]; then
            echo "Re-triggering sweep for $REMAINING remaining rows..."
            gh workflow run format_sweep.yml
          else
            echo "All rows classified — sweep complete, chain stops."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
