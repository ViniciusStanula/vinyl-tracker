name: umusicstore Crawler

# Two-tier cadence, both hitting umusicstore's public VTEX Search API (same
# endpoint their own storefront JS calls, unauthenticated):
#
# - Full sweep (1x/day): brand-partitioned discovery of the whole catalog
#   (~2500 requests, double-fetched to defend against a confirmed cold-cache
#   under-count — see umusicstore_crawler.py's module docstring). Finds new
#   releases and sync-drops anything that fell out of the catalog.
# - Refresh-only (4x/day): a single-fetch, ASC-only category listing
#   (~150 requests, no brand sweep). Refreshes price/availability for
#   whatever it touches; never sync-drops, since it only sees a fraction of
#   the catalog on any one run. Cheap price freshness without the full
#   sweep's request volume.

on:
  schedule:
    - cron: '40 4 * * *'      # 04:40 UTC daily — full sweep (new releases + sync-drop)
    - cron: '40 10 * * *'     # refresh-only
    - cron: '40 16 * * *'     # refresh-only
    - cron: '40 22 * * *'     # refresh-only
  workflow_dispatch:
    inputs:
      refresh_only:
        description: 'Run the lightweight refresh-only pass instead of a full sweep'
        type: boolean
        default: false

concurrency:
  group: umusicstore-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # full sweep measured ~40-50 min; refresh-only is much shorter
    permissions:
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Determine mode
        id: mode
        run: |
          # Full sweep on the 04:40 UTC cron; refresh-only on the other three
          # crons, or whenever manually dispatched with refresh_only=true.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "40 4 * * *" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.refresh_only }}" != "true" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--refresh-only" >> "$GITHUB_OUTPUT"
          fi

      - name: Run umusicstore crawler
        run: python crawler/umusicstore_crawler.py ${{ steps.mode.outputs.flag }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `umusicstore crawler failed — ${new Date().toISOString().slice(0, 16)} UTC`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The umusicstore crawler workflow failed.\n\n[View run](${runUrl})`,
              labels: ['crawler-failure'],
            });

      - name: Upload crawler log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: umusicstore-crawler-log-${{ github.run_id }}
          path: crawler/umusicstore_crawler.log
          if-no-files-found: ignore
